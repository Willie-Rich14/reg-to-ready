<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reg-to-Ready</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Reg-to-Ready">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#16202B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: SaaS app shell — fixed left rail of sections, top bar with workspace, content pane; rail becomes a bottom tab bar on phones. */
:root{
  --bg:#F3F4F1; --panel:#FFFFFF; --rail:#16202B; --rail-ink:#C9D3DD; --rail-active:#FFFFFF;
  --ink:#18212C; --muted:#5B6672; --line:#DADFE2; --soft:#E8EEF3;
  --accent:#1F5C8C; --accent-ink:#FFFFFF; --stamp:#2D6A4F;
  --high:#B3261E; --med:#A86400; --low:#3D6E3A; --info:#1F5C8C;
  --high-bg:#FBE9E7; --med-bg:#FFF3DF; --low-bg:#E8F2E6; --info-bg:#E3EDF6;
  --display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10161D; --panel:#18212B; --rail:#0B1016; --rail-ink:#9AA6B2; --rail-active:#FFFFFF;
  --ink:#E6EBF0; --muted:#9AA6B2; --line:#2A3542; --soft:#1F2C3A;
  --accent:#6FA8DC; --accent-ink:#0E1620; --stamp:#6BBF94;
  --high:#F2867D; --med:#E8B15C; --low:#8FCB89; --info:#8DBBE6;
  --high-bg:#3A1D1B; --med-bg:#382A12; --low-bg:#1C3020; --info-bg:#1A2B3C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10161D; --panel:#18212B; --rail:#0B1016; --rail-ink:#9AA6B2; --rail-active:#FFFFFF;
  --ink:#E6EBF0; --muted:#9AA6B2; --line:#2A3542; --soft:#1F2C3A;
  --accent:#6FA8DC; --accent-ink:#0E1620; --stamp:#6BBF94;
  --high:#F2867D; --med:#E8B15C; --low:#8FCB89; --info:#8DBBE6;
  --high-bg:#3A1D1B; --med-bg:#382A12; --low-bg:#1C3020; --info-bg:#1A2B3C; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100%}
.rail{background:var(--rail);color:var(--rail-ink);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.logo{font-family:var(--display);font-weight:700;font-size:22px;color:var(--rail-active);padding:4px 10px 18px}
.logo span{color:#6FA8DC}
.nav{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:inherit;font-size:14px;font-weight:500;padding:9px 10px;border-radius:5px;cursor:pointer;text-align:left}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8}
.nav[aria-current="page"]{background:rgba(255,255,255,.09);color:var(--rail-active)}
.nav:hover{color:var(--rail-active)}
.rail .spacer{flex:1}
.rail .ws{font-size:12px;padding:10px;border-top:1px solid rgba(255,255,255,.1)}
.rail .ws b{display:block;color:var(--rail-active);font-weight:600}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 24px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.crumbs{font-size:14px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumbs b{color:var(--ink);font-weight:600}
.top-right{display:flex;align-items:center;gap:10px;flex:none}
.demo{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--med);background:var(--med-bg);padding:3px 8px;border-radius:3px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--accent)}
.content{padding-inline:24px;padding-block:22px 48px;max-width:1180px;width:100%}

h1{font-family:var(--display);font-weight:600;font-size:26px;margin:0 0 4px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 20px;max-width:70ch}
h2{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px;min-width:0}
.cols{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:18px;align-items:start}
.stack{display:flex;flex-direction:column;gap:18px}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 16px}
.kpi .n{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .k{font-size:13px;color:var(--muted)}
.kpi.save .n{color:var(--stamp)}

.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:580px}
th,td{text-align:left;padding:10px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-family:var(--display);font-weight:600;letter-spacing:.05em;text-transform:uppercase;font-size:12px;color:var(--muted)}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--soft)}
.id{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--accent);white-space:nowrap}
.pill{display:inline-block;font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.05em;padding:2px 7px;border-radius:3px;white-space:nowrap}
.pill.High,.pill.s-draft{color:var(--high);background:var(--high-bg)}
.pill.Medium,.pill.s-review{color:var(--med);background:var(--med-bg)}
.pill.Low,.pill.s-ready,.pill.s-exported{color:var(--low);background:var(--low-bg)}
.pill.s-intake{color:var(--info);background:var(--info-bg)}
.bar{height:6px;background:var(--soft);border-radius:3px;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--stamp)}

.btn{font:600 14px var(--body);border-radius:4px;padding:9px 14px;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.55;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.deadline{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.deadline:last-child{border-bottom:0}
.deadline .when{font-family:var(--mono);font-size:12px;color:var(--muted);width:72px;flex:none}
.deadline .what{font-size:14px}

.ws-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:16px}
.steps{display:flex;flex-wrap:wrap;gap:0;margin:0 0 18px;padding:0;list-style:none;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel)}
.steps li{flex:1 1 120px;padding:10px 14px;font-size:13px;color:var(--muted);border-right:1px solid var(--line);display:flex;gap:8px;align-items:center}
.steps li:last-child{border-right:0}
.steps li .dot{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:11px;flex:none}
.steps li.done{color:var(--ink)}
.steps li.done .dot{background:var(--stamp);border-color:var(--stamp);color:var(--panel)}
.steps li.now{color:var(--ink);font-weight:600;background:var(--soft)}
.steps li.now .dot{border-color:var(--accent);color:var(--accent)}

.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--soft);border-radius:4px;padding:10px 12px}
.stat .n{font-family:var(--display);font-weight:700;font-size:24px;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .k{font-size:12px;color:var(--muted)}
.stat.save .n{color:var(--stamp)}
.tabs{display:flex;flex-wrap:wrap;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tab{font:600 13px var(--body);background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:8px 12px;cursor:pointer}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .c{font-family:var(--mono);font-weight:400;font-size:11px;margin-left:4px}
.list{display:flex;flex-direction:column;gap:10px}
.item{border:1px solid var(--line);border-radius:4px;padding:12px 14px;min-width:0}
.item .head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:4px}
.item .t{font-weight:600}
.item p{margin:4px 0 0}
.item .foot{display:flex;justify-content:flex-end;margin-top:8px}
.meta{font-size:12px;color:var(--muted)}
.approved{font:600 12px var(--body);color:var(--stamp)}
.story em{font-style:normal;color:var(--muted)}
ul.ac{margin:8px 0 0;padding-left:18px;font-size:14px}
ol.tsteps{margin:6px 0 0;padding-left:20px;font-size:14px}
.exp{margin-top:6px;font-size:14px}
.exp b{color:var(--stamp)}
.ok{color:var(--stamp);font-weight:600}
.gap{color:var(--high);font-weight:600}
.exports{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);align-items:center}
.status{font-size:13px;color:var(--muted)}
.status.err{color:var(--high)}

.form{display:grid;gap:14px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;font:14px/1.5 var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:9px 10px}
.field textarea{min-height:200px;resize:vertical}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.progress{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.progress li{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--muted)}
.progress li .dot{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line);flex:none}
.progress li.done{color:var(--ink)}
.progress li.done .dot{background:var(--stamp);border-color:var(--stamp)}
.progress li.now{color:var(--ink);font-weight:600}
.progress li.now .dot{border-color:var(--accent);border-top-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.progress li.now .dot{animation:none}}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:6px}
.card .t{font-weight:600}
.card p{margin:0;font-size:14px;color:var(--muted);flex:1}
.card .row{margin-top:8px}

.roi{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.slider{margin-bottom:16px}
.slider .lab{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px}
.slider .lab b{font-family:var(--mono);font-weight:500}
.slider input{width:100%;accent-color:var(--accent)}
.big{font-family:var(--display);font-weight:700;font-size:44px;line-height:1;color:var(--stamp);font-variant-numeric:tabular-nums}
.roi-line{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.roi-line b{font-variant-numeric:tabular-nums}
.fine{font-size:12px;color:var(--muted);margin-top:12px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:5px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}

@media (max-width:1000px){.cols,.roi{grid-template-columns:minmax(0,1fr)}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:10;gap:0}
  .logo,.rail .spacer,.rail .ws{display:none}
  .nav{flex-direction:column;gap:2px;font-size:11px;padding:6px 4px;text-align:center;width:auto;flex:1}
  .content{padding-inline:16px;padding-block:18px 96px}
  .topbar{padding:10px 16px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .two{grid-template-columns:minmax(0,1fr)}
  .avatar{display:none}
  .steps{flex-wrap:nowrap;overflow-x:auto}
  .steps li{flex:0 0 auto;padding:8px 12px;font-size:12px}
}
html,body{margin:0;overscroll-behavior:none}
body{-webkit-tap-highlight-color:transparent}
@media (display-mode: standalone){.topbar{padding-top:max(10px,env(safe-area-inset-top,0px))}}
</style>
</head>
<body>

<div class="app">
  <nav class="rail" aria-label="Sections">
    <div class="logo">Reg<span>-to-</span>Ready</div>
    <button class="nav" data-r="dashboard"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>Dashboard</button>
    <button class="nav" data-r="changes"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M9 12h7M9 16h7M9 8h3"/></svg>Changes</button>
    <button class="nav" data-r="new"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>New change</button>
    <button class="nav" data-r="value"><svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16"/><path d="M8 15l4-4 3 3 5-6"/></svg>Value</button>
    <button class="nav" data-r="integrations"><svg viewBox="0 0 24 24"><path d="M9 7V3M15 7V3M7 7h10v5a5 5 0 0 1-10 0z"/><path d="M12 17v4"/></svg>Integrations</button>
    <div class="spacer"></div>
    <div class="ws">Workspace<b>Demo Life Insurance Co.</b>Fictional demo data</div>
  </nav>

  <div class="main">
    <header class="topbar">
      <div class="crumbs" id="crumbs"></div>
      <div class="top-right"><span class="demo">Demo mode</span><div class="avatar" aria-hidden="true">DU</div></div>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
/* ---------- Demo data (fictional workspace, illustrative content) ---------- */
const VM22 = {
  impact:[
    {area:"Actuarial modeling",system:"Projection / valuation engine",severity:"High",note:"New stochastic and deterministic reserve runs using prescribed economic scenarios."},
    {area:"Policy administration",system:"Annuity admin platform",severity:"High",note:"Contract-level data feeds needed: product type, guarantees, crediting strategy, issue cohort."},
    {area:"Data warehouse",system:"Valuation data mart",severity:"Medium",note:"New fields for reserving category and exclusion test results; history must be kept."},
    {area:"Financial reporting",system:"Statutory GL and annual statement",severity:"Medium",note:"Reserve results must reconcile to statutory reporting, including transition amounts."},
    {area:"Governance",system:"Assumption and model governance",severity:"Medium",note:"Assumption margins and model changes need documented approval for the PBR report."},
    {area:"Reporting",system:"BI / management reporting",severity:"Low",note:"Dashboards for reserve movement by category and phase-in status."}
  ],
  requirements:[
    {id:"BR-01",title:"Assign reserving categories",priority:"High",text:"The system shall assign every in-scope non-variable annuity contract to a VM-22 reserving category and keep that assignment with an effective date."},
    {id:"BR-02",title:"Run exclusion tests",priority:"High",text:"The system shall run and store the exclusion test for each reserving category to determine whether stochastic modeling is required, with inputs and result retained for audit."},
    {id:"BR-03",title:"Calculate reserve components",priority:"High",text:"The valuation engine shall calculate the stochastic reserve, deterministic reserve and standard projection amount, and report the final reserve per category."},
    {id:"BR-04",title:"Use prescribed scenarios",priority:"High",text:"Reserve runs shall use the prescribed economic scenario set, and each run shall record the scenario set version used."},
    {id:"BR-05",title:"Track phase-in status",priority:"Medium",text:"The system shall record, per legal entity and product block, whether VM-22 has been elected during the transition period and from which valuation date."},
    {id:"BR-06",title:"Reconcile to statutory reporting",priority:"Medium",text:"Reserve results shall reconcile to the statutory general ledger, with differences above a set tolerance flagged before close."},
    {id:"BR-07",title:"Govern assumptions",priority:"Medium",text:"Assumptions and margins used in each run shall be versioned, approved and linked to the run that used them."}
  ],
  stories:[
    {id:"US-01",req:"BR-01",as:"valuation actuary",want:"each contract tagged with its reserving category",so:"reserves are grouped correctly from the first run",points:5,ac:["Every in-scope contract has exactly one category","Contracts with missing data land on an exception report","Category changes keep the prior value and effective date"]},
    {id:"US-02",req:"BR-02",as:"valuation actuary",want:"the exclusion test run and saved per category",so:"I can show auditors why stochastic modeling was or wasn't required",points:8,ac:["Test result is stored with all inputs","Reruns match within tolerance","Failed categories route to the stochastic run automatically"]},
    {id:"US-03",req:"BR-03",as:"financial reporting analyst",want:"the reserve components for each category in one output",so:"I can review the final reserve without asking the modeling team",points:8,ac:["Output shows stochastic, deterministic and standard projection amounts","Final reserve rule is applied and labeled","Totals tie to the run summary"]},
    {id:"US-04",req:"BR-04",as:"model risk reviewer",want:"each run to record which scenario set it used",so:"a run can be reproduced later",points:3,ac:["Scenario set version is stamped on every run","A run on an unapproved scenario set is blocked"]},
    {id:"US-05",req:"BR-05",as:"appointed actuary",want:"the phase-in election tracked by entity and block",so:"the right method is applied on each valuation date",points:3,ac:["Election date and scope are editable only by approved roles","Method selection follows the stored election"]},
    {id:"US-06",req:"BR-06",as:"controller",want:"reserves reconciled to the statutory GL before close",so:"we don't file a mismatch",points:5,ac:["Reconciliation runs on demand and on schedule","Breaks over tolerance are flagged with amount and category"]},
    {id:"US-07",req:"BR-07",as:"assumption owner",want:"assumption sets versioned and approved",so:"the PBR report can cite exactly what was used",points:5,ac:["Each set has an approver and approval date","Runs link to the assumption set version used"]}
  ],
  tests:[
    {id:"TC-01",story:"US-01",title:"Every contract gets one reserving category",steps:["Load 500 test contracts across product types","Run category assignment","Count contracts by category"],expected:"500 assigned; none unassigned; none in two categories."},
    {id:"TC-02",story:"US-01",title:"Missing data goes to exceptions",steps:["Load 10 contracts with blank product type","Run category assignment"],expected:"All 10 appear on the exception report."},
    {id:"TC-03",story:"US-02",title:"Exclusion test result is stored with inputs",steps:["Run the exclusion test for one category","Open the stored result"],expected:"Result plus every input value is retained and viewable."},
    {id:"TC-04",story:"US-02",title:"Failed category routes to stochastic run",steps:["Force a category to fail the exclusion test","Start valuation"],expected:"That category is included in the stochastic run."},
    {id:"TC-05",story:"US-03",title:"Reserve components appear in output",steps:["Run valuation for a test category","Open output"],expected:"All three components shown; final reserve labeled."},
    {id:"TC-06",story:"US-04",title:"Unapproved scenario set is blocked",steps:["Point a run at an unapproved scenario set","Start the run"],expected:"Run is blocked with a message naming the scenario set."},
    {id:"TC-07",story:"US-05",title:"Method follows phase-in election",steps:["Set entity A elected, entity B not elected","Run valuation for both"],expected:"Entity A uses VM-22; entity B uses the prior method."},
    {id:"TC-08",story:"US-06",title:"GL break over tolerance is flagged",steps:["Post a GL amount differing from the reserve beyond tolerance","Run reconciliation"],expected:"Break flagged with amount and category before close."}
  ]
};
const LDTI = {
  impact:[
    {area:"Actuarial modeling",system:"Liability valuation engine",severity:"High",note:"Annual cash-flow assumption unlocking and quarterly discount-rate remeasurement by cohort."},
    {area:"Finance",system:"GAAP sub-ledger",severity:"High",note:"Split of remeasurement between net income and other comprehensive income."},
    {area:"Data warehouse",system:"Cohort data store",severity:"Medium",note:"Persist cohort membership, locked-in and current discount rates."},
    {area:"Disclosures",system:"Financial reporting tool",severity:"Medium",note:"Disaggregated rollforwards by cohort grouping."},
    {area:"Controls",system:"SOX control library",severity:"Low",note:"New key controls over assumption updates and rate sourcing."}
  ],
  requirements:[
    {id:"BR-01",title:"Maintain annual cohorts",priority:"High",text:"The system shall assign each contract to an annual cohort at issue and keep that assignment unchanged."},
    {id:"BR-02",title:"Store discount rates",priority:"High",text:"The system shall store the locked-in discount rate per cohort and the current discount rate per reporting period."},
    {id:"BR-03",title:"Unlock cash-flow assumptions",priority:"High",text:"The valuation engine shall update the liability for actual experience and revised cash-flow assumptions at least annually, recording the effect in net income."},
    {id:"BR-04",title:"Remeasure for rate changes",priority:"Medium",text:"The system shall remeasure the liability each period for discount-rate changes and post the effect to other comprehensive income."},

    }finally{const b=$("n-go");if(b)b.disabled=false}

${text.slice(0,12000)}`}

  v.innerHTML=`<h1>What it's worth to your team</h1><p class="sub">Move the sliders to match your organization. The math updates as you go.</p>
  <div class="roi"><section class="panel">
    ${slider("analysts","Business analysts",5,100,1,"")}
    ${slider("changes","Changes per analyst per year",1,12,1,"")}
    ${slider("rate","Loaded cost per analyst hour",50,175,5,"$")}
    ${slider("reduction","Drafting time Reg-to-Ready removes",30,80,5,"%")}
  </section>
  <section class="panel"><h2>Estimated annual value</h2><div class="big" id="r-dollars"></div><div class="meta" style="margin:6px 0 14px">in analyst time returned per year</div>
    <div class="roi-line"><span>Delivery packages per year</span><b id="r-pk"></b></div>
    <div class="roi-line"><span>Manual drafting hours per package</span><b>~29 h</b></div>
    <div class="roi-line"><span>Hours returned per year</span><b id="r-hrs"></b></div>
    <div class="roi-line"><span>Full-time analysts' worth of capacity</span><b id="r-fte"></b></div>
    <p class="fine">Estimates. Hours per package come from the VM-22 demo package (7 requirements, 7 stories, 8 tests at about 2 h, 1 h and 45 min each to draft by hand). A full-time analyst is taken as 1,800 working hours a year.</p>
  </section></div>`;
  v.querySelectorAll("input[type=range]").forEach(i=>i.oninput=()=>{ROI[i.dataset.k]=+i.value;calc()});calc();
}
function slider(k,l,min,max,step,u){return `<div class="slider"><div class="lab"><label for="r-${k}">${l}</label><b id="o-${k}"></b></div><input type="range" id="r-${k}" data-k="${k}" min="${min}" max="${max}" step="${step}" value="${ROI[k]}" data-u="${u}"></div>`}
function calc(){
  const fmt=n=>n.toLocaleString("en-US");
  $("o-analysts").textContent=ROI.analysts;$("o-changes").textContent=ROI.changes;$("o-rate").textContent="$"+ROI.rate;$("o-reduction").textContent=ROI.reduction+"%";
  const pk=ROI.analysts*ROI.changes, hrs=Math.round(pk*29*ROI.reduction/100);
  $("r-pk").textContent=fmt(pk);$("r-hrs").textContent=fmt(hrs)+" h";$("r-fte").textContent=(hrs/1800).toFixed(1);
  $("r-dollars").textContent="$"+fmt(Math.round(hrs*ROI.rate/1000)*1000);
}

/* ---------- Integrations ---------- */
function viewIntegrations(v){
  crumbs("<b>Integrations</b>");
  const list=[["Jira","Stories land in your backlog with acceptance criteria and links back to requirements.","Connected"],["qTest","UAT test cases sync with steps, expected results and story links.","Connected"],["Azure DevOps","Work items and test plans for teams on Microsoft tooling.","Available"],["Confluence","Publish requirements documents and the traceability matrix as pages.","Available"],["SharePoint","Store signed-off packages with your audit evidence.","Available"],["CSV export","Download any package for tools not listed here.","Built in"]];
  v.innerHTML=`<h1>Integrations</h1><p class="sub">Reg-to-Ready sends work to the tools your teams already use, so nobody changes how they work.</p>
  <div class="cards">${list.map(([n,d,s])=>`<div class="card"><div class="row" style="justify-content:space-between"><span class="t">${n}</span><span class="pill ${s==="Connected"?"s-ready":s==="Built in"?"s-intake":"s-review"}">${s}</span></div><p>${d}</p></div>`).join("")}</div>
  <p class="fine">Demo mode: connections are illustrated, not live.</p>`;
}

/* ---------- Boot ---------- */
const startHash=(location.hash||"").slice(1);
if(["dashboard","changes","new","value","integrations"].includes(startHash))route=startHash;
render();
(async()=>{
  if(!window.claude||!claude.use)return;
  try{sample=await claude.use("sample")}catch{sample=null}
  try{downloads=await claude.use("downloads")}catch{downloads=null}
  if(route==="new"||route==="change")render();
})();

if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
